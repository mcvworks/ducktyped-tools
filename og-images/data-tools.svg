<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00aaff" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow -->
  <ellipse cx="900" cy="200" rx="400" ry="300" fill="url(#accent)"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="4" fill="#00aaff"/>

  <!-- Category badge -->
  <rect x="920" y="40" width="220" height="36" rx="18" fill="#00aaff20" stroke="#00aaff" stroke-width="1.5"/>
  <text x="1030" y="64" fill="#00aaff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">TOOL COLLECTION</text>

  <!-- Tool name -->
  <text x="80" y="300" fill="#E9EEF5" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Data Tools</text>

  <!-- Subtitle -->
  <text x="80" y="350" fill="#8892A0" font-family="system-ui, -apple-system, sans-serif" font-size="22">Free, private, browser-based developer tool</text>

  <!-- Bottom branding -->
  <text x="80" y="570" fill="#F2C200" font-family="monospace" font-size="28" font-weight="700" letter-spacing="2">duckTyped</text>
  <text x="320" y="570" fill="#555" font-family="system-ui, -apple-system, sans-serif" font-size="18">ducktyped.xyz</text>

  <!-- Bottom border -->
  <rect x="0" y="626" width="1200" height="4" fill="#00aaff" opacity="0.5"/>
</svg>